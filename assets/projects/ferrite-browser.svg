  </g>
  <g><text x="32" y="124" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#aab1d0">A browser for AI agents, built in Rust on the Servo engine.</text><text x="32" y="150" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#aab1d0">It can't be talked into things: it predicts what a task needs,</text><text x="32" y="176" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#aab1d0">dry-runs the plan, compares, and asks before anything else runs.</text></g>
