<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Ferrite: A browser for AI agents, built in Rust on the Servo engine. It can't be talked into things: it predicts what a task needs, dry-runs the plan, compares, and asks before anything else runs." fill="none">
<style>
    .sweep { animation: sweep 7s ease-in-out infinite; }
    @keyframes sweep { 0%, 55% { transform: translateX(-600px); } 100% { transform: translateX(1400px); } }
    .orb { transform-box: fill-box; transform-origin: center; animation: orb 9s ease-in-out infinite alternate; }
    @keyframes orb { to { transform: translate(-60px, 30px) scale(1.2); } }
    </style>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1122"/><stop offset="1" stop-color="#08090f"/></linearGradient>
    <radialGradient id="horb"><stop offset="0" stop-color="#fb923c" stop-opacity=".28"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient>
    <linearGradient id="hsh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="hedge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="260">
      <stop offset="0" stop-color="#fb923c"/><stop offset=".5" stop-color="#262a45" stop-opacity=".5"/><stop offset="1" stop-color="#fb923c" stop-opacity=".4"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 600.0 130.0;360 600.0 130.0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="hclip"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#hclip)">
    <rect width="1200" height="260" fill="url(#hbg)"/>
    <circle class="orb" cx="1080" cy="40" r="220" fill="url(#horb)"/>
    <rect class="sweep" x="0" y="0" width="400" height="260" fill="url(#hsh)" transform="skewX(-20)"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="258.5" rx="18" stroke="url(#hedge)" stroke-width="1.5"/>
  <g>
