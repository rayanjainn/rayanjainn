<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-label="DevHub: Postman + DevTools + Burp Suite in one workspace: API client, MITM proxy, fuzzer and an AI that knows your stack." fill="none">
<style>
    .sweep { animation: sweep 7s ease-in-out infinite; }
    @keyframes sweep { 0%, 55% { transform: translateX(-300px); } 100% { transform: translateX(800px); } }
    .orb { transform-box: fill-box; transform-origin: center; animation: orb 9s ease-in-out infinite alternate; }
    @keyframes orb { to { transform: translate(-60px, 30px) scale(1.2); } }
    </style>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1122"/><stop offset="1" stop-color="#08090f"/></linearGradient>
    <radialGradient id="porb"><stop offset="0" stop-color="#a78bfa" stop-opacity=".28"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <linearGradient id="psh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="pedge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="240">
      <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#262a45" stop-opacity=".5"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".4"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 300.0 120.0;360 300.0 120.0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="pclip"><rect width="600" height="240" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#pclip)">
    <rect width="600" height="240" fill="url(#pbg)"/>
    <circle class="orb" cx="480" cy="40" r="170" fill="url(#porb)"/>
    <rect class="sweep" x="0" y="0" width="200" height="240" fill="url(#psh)" transform="skewX(-20)"/>
  </g>
  <rect x=".75" y=".75" width="598.5" height="238.5" rx="18" stroke="url(#pedge)" stroke-width="1.5"/>
  <g>
    <text x="32.0" y="40" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#a78bfa" textLength="96.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve" letter-spacing="1">04 / dev tools</text>
    <circle cx="482.0" cy="35" r="5" fill="#3178c6"/>
    <text x="493.0" y="40" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#8b93b8" textLength="72.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >TypeScript</text>
    
    <text x="30" y="82" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="-1" fill="#e6e9f5">DevHub</text>
  </g>
  <g><text x="32" y="118.0" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#aab1d0">Postman + DevTools + Burp Suite in one workspace: API</text><text x="32" y="141.5" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#aab1d0">client, MITM proxy, fuzzer and an AI that knows your stack.</text></g>
  <g><rect x="32.0" y="190" width="72.8" height="24" rx="12" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".3"/><text x="42.0" y="206" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#a78bfa" textLength="52.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >electron</text><rect x="112.8" y="190" width="86.0" height="24" rx="12" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".3"/><text x="122.8" y="206" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#a78bfa" textLength="66.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >mitm proxy</text><rect x="206.8" y="190" width="39.8" height="24" rx="12" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".3"/><text x="216.8" y="206" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#a78bfa" textLength="19.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >cdp</text><rect x="254.6" y="190" width="86.0" height="24" rx="12" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".3"/><text x="264.6" y="206" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#a78bfa" textLength="66.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >chrome mv3</text></g>
  
</svg>
