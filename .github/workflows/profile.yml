name: Refresh profile

on:
  schedule:
    - cron: "17 */12 * * *"
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  cards:
    name: Stats & cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render SVGs
        run: python3 scripts/generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

      - name: Commit
        run: |
          git config user.name "Rayan Jain"
          git config user.email "rayansjain@gmail.com"
          git add assets
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile stats"
          git pull --rebase origin main
          git push origin HEAD:main

  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: rayanjainn
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#f472b6&color_dots=#161b22,#2e1065,#5b21b6,#8b5cf6,#c4b5fd

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          author: Rayan Jain <rayansjain@gmail.com>
          committer: Rayan Jain <rayansjain@gmail.com>
          commit_message: "chore: refresh contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
