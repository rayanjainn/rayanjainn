name: Refresh profile

on:
  schedule:
    - cron: "7 * * * *"
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  refresh:
    name: Live cards & snake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render live cards
        run: python3 scripts/generate.py --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

      - uses: Platane/snk@v3
        with:
          github_user_name: rayanjainn
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#f472b6&color_dots=#161b22,#2e1065,#5b21b6,#8b5cf6,#c4b5fd

      # Published to a side branch so main's history (and the contribution graph) stays clean.
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          author: Rayan Jain <rayansjain@gmail.com>
          committer: Rayan Jain <rayansjain@gmail.com>
          commit_message: "chore: refresh live cards"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub pauses schedules after 60 quiet days; re-enabling resets that clock.
      - name: Keep schedule alive
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/profile.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
